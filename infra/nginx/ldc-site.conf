# Install into /etc/nginx/sites-available/ldc and symlink from sites-enabled:
#   sudo cp infra/nginx/ldc-site.conf /etc/nginx/sites-available/ldc
#   sudo ln -sf /etc/nginx/sites-available/ldc /etc/nginx/sites-enabled/ldc
# Requires infra/nginx/ldc-upstream.conf installed to /etc/nginx/conf.d/ first
# (defines the ldc_app upstream and rate-limit/cache zones referenced below).
#
# Listens on :3000 to match the ports table documented in README.md and
# docs/production-operations.md. Point a public-facing nginx `server_name`
# block / TLS vhost at 127.0.0.1:3000, or change `listen` here directly if
# this is the public-facing vhost itself.

server {
    listen 3000;
    server_name _;

    access_log /var/log/nginx/ldc-access.log combined;
    error_log  /var/log/nginx/ldc-error.log warn;

    # Per-IP connection limit — drop sustained connection floods
    limit_conn ldc_conn 20;

    # Proxy timeouts
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    # Security headers — applied to all proxied responses
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header X-DNS-Prefetch-Control    "off"                             always;
    # Uncomment when TLS is active:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Deny scanners and common exploit probes
    location ~* ^/(\.env|\.git|wp-admin|wp-login|phpmyadmin|xmlrpc|\.php|cgi-bin|boaform|vendor|actuator|\.well-known/acme-challenge) {
        deny all;
        return 404;
    }

    # Block requests with suspicious or missing Host headers
    if ($host !~* ^[\w\.\-]+$) {
        return 444;
    }

    # Reject methods we don't use
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
        return 405;
    }

    # Health check — no rate limit, no caching, used by monitoring / load balancer
    location = /api/health {
        proxy_pass         http://ldc_app;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";
        access_log off;
    }

    # Login only — tight brute-force rate limit
    location = /api/auth/login {
        limit_req        zone=ldc_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://ldc_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Verify + logout — global rate limit only; called on every page navigation
    location /api/auth/ {
        limit_req        zone=ldc_global burst=60 nodelay;
        limit_req_status 429;

        proxy_pass         http://ldc_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Public signup form — generous rate limit + 5-second microcache.
    # Protects Next.js from re-rendering on every concurrent request during signup surges.
    # Cache is bypassed for POST requests (form submissions).
    location /forms/ {
        limit_req        zone=ldc_public burst=120 nodelay;
        limit_req_status 429;

        proxy_cache            ldc_pages;
        proxy_cache_valid      200 5s;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_methods    GET HEAD;
        add_header             X-Cache-Status $upstream_cache_status always;

        proxy_pass         http://ldc_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Next.js hot-reload WebSocket (dev mode only)
    location /_next/webpack-hmr {
        proxy_pass         http://ldc_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Static assets — immutable cache, no rate limit
    location /_next/static/ {
        proxy_pass         http://ldc_app;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else — global rate limit
    location / {
        limit_req        zone=ldc_global burst=60 nodelay;
        limit_req_status 429;

        proxy_pass         http://ldc_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;
    }
}
