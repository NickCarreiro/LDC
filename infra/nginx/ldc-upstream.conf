# Install into /etc/nginx/conf.d/ldc-upstream.conf
# Loaded automatically by the stock `include /etc/nginx/conf.d/*.conf;`
# line inside the `http {}` block of /etc/nginx/nginx.conf — no edits to
# nginx.conf itself are required.

##
# Rate Limiting Zones
# ldc_global:  120 r/m — organizer console pages (tight; ~20-30 sub-requests per page)
# ldc_auth:      5 r/m — brute-force protection on login; 5 attempts/min per IP
# ldc_public:  300 r/m — public signup form; each real user has their own bucket
##
limit_req_zone $binary_remote_addr zone=ldc_global:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=ldc_auth:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=ldc_public:10m rate=300r/m;

##
# Connection Limiting Zone — anti-DoS; 20 simultaneous connections per IP
##
limit_conn_zone $binary_remote_addr zone=ldc_conn:10m;

##
# Proxy microcache — 5-second cache for public form page HTML.
# Collapses simultaneous requests during signup surges into a single upstream hit.
##
proxy_cache_path /var/cache/nginx/ldc levels=1:2 keys_zone=ldc_pages:10m max_size=100m inactive=60s use_temp_path=off;

##
# Upstream — Next.js frontend service (ldc-frontend.service, port 3001)
##
upstream ldc_app {
    server 127.0.0.1:3001;
    keepalive 32;
}
