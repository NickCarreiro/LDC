[project]
name = "ldc-backend"
version = "0.1.0"
description = "Internal Catholic matchmaking operations API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.31",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "cryptography>=43.0.0",
  "python-jose[cryptography]>=3.3.0",
  "email-validator>=2.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
